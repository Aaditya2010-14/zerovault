{{define "content"}}
<h1>Vault</h1>
<div style="margin-bottom: 1rem;"><a href="/add" class="btn">+ Add entry</a></div>
<div class="card">
  {{if not .Entries}}
    <div class="empty">No entries yet. <a href="/add">Add your first one</a>.</div>
  {{else}}
    {{range .Entries}}
    <div class="entry-row">
      <div>
        <div class="entry-name"><a href="/entry/{{.Name}}" style="color:inherit;text-decoration:none;">{{.Name}}</a></div>
        {{if .Username}}<div class="entry-sub">{{.Username}}</div>{{end}}
      </div>
      <a href="/entry/{{.Name}}" class="btn-secondary btn">View</a>
    </div>
    {{end}}
  {{end}}
</div>
{{end}}
