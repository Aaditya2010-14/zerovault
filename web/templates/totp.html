{{define "content"}}
<h1>TOTP Codes</h1>
<div style="margin-bottom: 1rem;">
  <a href="#" class="btn" onclick="document.getElementById('add-totp').style.display='block';return false;">+ Add TOTP secret</a>
</div>

<div class="card" id="add-totp" style="display:none;">
  <form method="post" action="/totp">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>
    <label for="secret">Secret (base32)</label>
    <input type="text" id="secret" name="secret" class="mono" required>
    <div style="margin-top: 1rem;">
      <button type="submit">Add</button>
    </div>
  </form>
</div>

<div class="card">
  {{if not .Entries}}
    <div class="empty">No TOTP entries yet.</div>
  {{else}}
    <table>
      <tr><th>Name</th><th>Code</th><th>Refreshes</th><th></th></tr>
      {{range .Entries}}
      <tr>
        <td>{{.Name}}</td>
        <td class="code">{{.Code}}</td>
        <td class="countdown" data-remaining="{{$.Remaining}}">{{$.Remaining}}s</td>
        <td>
          <form method="post" action="/totp/delete/{{.Name}}" data-confirm="Delete TOTP entry {{.Name}}?" style="display:inline;">
            <button type="submit" class="btn-secondary">Delete</button>
          </form>
        </td>
      </tr>
      {{end}}
    </table>
  {{end}}
</div>
{{end}}
