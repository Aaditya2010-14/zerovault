{{define "content"}}
<h1>Password Generator</h1>
<div class="card">
  <form method="post" action="/generate">
    <label for="length">Length</label>
    <input type="number" id="length" name="length" min="4" max="128" value="{{.Length}}">

    <label style="display:flex; align-items:center; gap:0.5rem; margin-top:0.75rem;">
      <input type="checkbox" name="upper" {{if .Upper}}checked{{end}} style="width:auto;"> Uppercase
    </label>
    <label style="display:flex; align-items:center; gap:0.5rem;">
      <input type="checkbox" name="lower" {{if .Lower}}checked{{end}} style="width:auto;"> Lowercase
    </label>
    <label style="display:flex; align-items:center; gap:0.5rem;">
      <input type="checkbox" name="digits" {{if .Digits}}checked{{end}} style="width:auto;"> Digits
    </label>
    <label style="display:flex; align-items:center; gap:0.5rem;">
      <input type="checkbox" name="symbols" {{if .Symbols}}checked{{end}} style="width:auto;"> Symbols
    </label>

    <div style="margin-top: 1rem;">
      <button type="submit">Generate</button>
    </div>
  </form>

  {{if .Generated}}
  <div style="margin-top: 1.5rem; display:flex; align-items:center; gap:0.75rem;">
    <span class="code mono">{{.Generated}}</span>
    <button type="button" class="btn-secondary" data-copy="{{.Generated}}">Copy</button>
  </div>
  {{end}}
</div>
{{end}}
