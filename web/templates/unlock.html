{{define "content"}}
<div class="unlock-page">
<div class="unlock-wrap">
  <div class="unlock-logo">ZeroVault</div>
  <div class="card">
    <h1>{{if .VaultExists}}Unlock Vault{{else}}Create Vault{{end}}</h1>
    <form method="post" action="/unlock">
      <label for="password">Master password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" autofocus required>
        {{template "password-toggle-btn"}}
      </div>
      {{if not .VaultExists}}
      <label for="confirm">Confirm master password</label>
      <div class="password-field">
        <input type="password" id="confirm" name="confirm" required>
        {{template "password-toggle-btn"}}
      </div>
      {{end}}
      <div style="margin-top: 1rem;">
        <button type="submit">{{if .VaultExists}}Unlock{{else}}Create Vault{{end}}</button>
      </div>
    </form>
  </div>
</div>
</div>
{{end}}
